name: Deterministic CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deterministic-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch current planning authority
        run: git fetch --no-tags --depth=1 origin refs/heads/planning/future-sssf:refs/remotes/origin/planning/future-sssf
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
          check-latest: false
          token: ''
      - name: Install exact Python test runner
        run: python -m pip install pytest==8.3.5 iniconfig==2.0.0 packaging==24.2 pluggy==1.5.0 colorama==0.4.6
      - name: Set up exact Bun without a mutable cache
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'
          no-cache: true
      - name: Set up exact just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: '1.58.0'
          github-token: ''
      - name: Run non-vacuous offline gate
        run: python tools/ci_gate.py run --evidence ci-evidence-${{ runner.os }}.json
